services:
  - type: web
    name: noxis-gateway
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: NOXIS_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./noxis.db
      - key: POLLINATIONS_ENABLED
        value: true
      - key: POLLINATIONS_BASE_URL
        value: https://text.pollinations.ai
      - key: KEYLESSAI_ENABLED
        value: true
      - key: KEYLESSAI_BASE_URL
        value: https://keylessai.thryx.workers.dev/v1
      - key: LLM7_ENABLED
        value: false
      - key: DEVTOOLBOX_ENABLED
        value: false
      - key: INFERENCEPORT_ENABLED
        value: false
      - key: ALLOW_UNAUTHENTICATED
        value: false
    autoDeploy: true
